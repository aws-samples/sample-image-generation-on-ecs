global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: "cdk.out/"
      reason: "CDK synth output — validated by cdk-nag directly, not checkov on generated templates"
    - path: "cdk.out.*/"
      reason: "Environment-specific CDK synth output (cdk.out.gpu, cdk.out.neuron, cdk.out.both)"
    - path: "cdk-out-2/"
      reason: "Alternate CDK output directory — same as cdk.out, validated by cdk-nag"
    - path: "web/frontend/dist/"
      reason: "Vite build output — minified JS with content hashes in filenames, not secrets"
    - path: ".venv/"
      reason: "Python virtual environment — third-party code"
    - path: "node_modules/"
      reason: "Node dependencies — third-party code"
    - path: ".mypy_cache/"
      reason: "Type checker cache — auto-generated binary hashes"
    - path: ".idea/"
      reason: "IDE configuration"
    - path: ".git/"
      reason: "Git internals"
    - path: ".claude/"
      reason: "Claude Code working files — worktrees, plans, transcripts"
    - path: ".playwright-mcp/"
      reason: "Playwright browser snapshots/console logs from UI testing — capture presigned S3 URLs whose X-Amz-Credential is a short-lived STS token (1h expiry), not a stored credential"
    - path: "test-results/"
      reason: "Playwright test run artifacts — regenerated each run, same presigned-URL capture as .playwright-mcp/"
    - path: ".secrets.baseline"
      reason: "detect-secrets baseline contains hashed secrets for audit tracking"
    - path: "docs/"
      reason: "Documentation contains example code with placeholder hashes — not secrets"
    - path: "infra/utils/constants.py"
      reason: "Contains git commit SHA for upstream model repo pinning — not a secret"
    - path: "runtime/lib/cache_version.py"
      reason: "SHA256 computation module — no actual secrets"
    - path: "tests/"
      reason: "Test fixtures contain dummy hashes/checksums for integrity testing — not secrets"
    - path: "scripts/"
      reason: "Developer helper scripts contain test-user placeholder passwords — not production secrets"

  suppressions:
    - rule_id: "CKV_DOCKER_2"
      path: "runtime/Dockerfile.*"
      reason: "SageMaker manages container health via /ping endpoint — Docker HEALTHCHECK is unnecessary"
    - rule_id: "CKV_DOCKER_3"
      path: "runtime/Dockerfile.*"
      reason: "SageMaker inference containers require root for model serving and dependency installation"
    - rule_id: "CKV_DOCKER_7"
      path: "runtime/Dockerfile.*"
      reason: "Base image is pinned via ARG BASE_IMAGE at build time (see infra/utils/constants.py)"
    - rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
      path: "infra/utils/constants.py"
      reason: "Git commit SHA (26f23eda...) pinning upstream model repo — not a secret"
    - rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
      path: "runtime/lib/cache_version.py"
      reason: "SHA256 computation module — no actual secrets, only hash logic"
    - rule_id: "SECRET-HEX-HIGH-ENTROPY-STRING"
      path: "tests/unit/runtime/neuron/test_neuron_utils.py"
      reason: "Test fixture uses MD5 of empty string — not a secret"
    - rule_id: "trailofbits.python.pickles-in-pytorch.pickles-in-pytorch"
      path: "runtime/serving/**"
      reason: "torch.load with weights_only=True — safe deserialization of trusted IPC data between our own processes"
    - rule_id: "python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected"
      path: "web/backend/auth.py"
      reason: "URL is built from server-side config (Cognito region + pool ID), not user input. HTTPS scheme is validated before the call."
    - rule_id: "python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected"
      path: "web/backend/auth_routes.py"
      reason: "Token exchange URL is Cognito's /oauth2/token endpoint, constructed from server-side config. Not user input."
    - rule_id: "javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring"
      path: "web/frontend/src/**"
      reason: "Console debug logging with template literals — client-side only, no injection risk"
    - rule_id: "python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected"
      path: "web/backend/inference_client.py"
      reason: "ALB URL from server-side env var (ZIMAGE_INFERENCE_ALB_URL). Internal VPC traffic only."
    - rule_id: "python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected"
      path: "web/backend/websocket_handler.py"
      reason: "ALB URL from server-side env var (ZIMAGE_INFERENCE_ALB_URL). Internal VPC traffic only."
    - rule_id: "python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected"
      path: "web/backend/jwt_verify.py"
      reason: "JWKS URL constructed from server-side Cognito config. Not user input."


[project]
name            = "zimage-cdk"
version         = "0.2.0"
description     = "CDK app for Z-Image-Turbo inference on AWS Inferentia2"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib==2.248.0",
    "constructs==10.6.0",
    "cdk-nag==2.38.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "boto3==1.40.61",
    "loguru==0.7.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
lambda = [
    "aws-lambda-powertools[tracer]==3.29.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.15",
    "vulture==2.16",
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "automated-security-helper @ git+https://github.com/awslabs/automated-security-helper.git@v3.4.0",
    "moto[s3]==5.2.1",
    "pytz==2026.2",
    "requests==2.34.2",
    # Web backend deps, needed for local dev (`make dev`) and the web tests.
    # The deployed Lambda layer installs from web/backend/requirements.txt, not
    # from here — keep the two lists in sync when bumping versions.
    "fastapi==0.140.7",
    "uvicorn[standard]==0.51.0",
    "aioboto3==15.5.0",
    "python-multipart==0.0.32",
    "websockets==16.1.1",
    "python-jose[cryptography]==3.5.0",
    "pillow==13.0.0",
    "python-dotenv==1.2.2",
]

[tool.pytest.ini_options]
markers = [
    "unit: pure unit tests",
    "integration: moto/in-memory AWS",
    "aws: requires real AWS credentials",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["infra", "runtime", "web/backend"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 45

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["infra", "runtime", "web/backend", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",               # isort (import ordering)
    "UP",              # pyupgrade (modern Python syntax)
    "B",               # flake8-bugbear (common bugs)
    "SIM",             # flake8-simplify
    "C4",              # flake8-comprehensions (better list/dict/set comprehensions)
    "PT",              # flake8-pytest-style
    "PERF",            # perflint (performance anti-patterns)
    "T20",             # flake8-print (no print() in production code)
    "RUF",             # ruff-specific rules
]
ignore = ["E501", "PT011", "PT019", "PERF102", "PERF203", "PERF401", "RUF001", "RUF002", "RUF003", "RUF005", "RUF059"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "SIM116", "SIM117", "PT004", "PT006", "T201"]
"runtime/compile/**" = ["E402", "T201", "B007", "B008", "B905", "C408", "SIM105"]
"runtime/serving/production/**" = ["E402", "PERF401"]
"runtime/serving/server.py" = ["E402"]
"runtime/serving/encoder_server.py" = ["E402", "T201"]
"runtime/serving/_safety.py" = ["B008"]
"runtime/neuron/**" = ["SIM102", "SIM105", "SIM108", "B905", "UP042"]
"infra/lambdas/**" = ["E402"]
"web/backend/lambda_handler.py" = ["E402"]

[tool.vulture]
paths = ["infra/", "runtime/lib/", "web/backend/", ".vulture_whitelist.py"]
exclude = ["runtime/neuron", "runtime/compile", "runtime/serving/production"]
min_confidence = 80

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra", "runtime"]
